name: CI — Build & Type Check

# Runs on every push to any branch, and on every Pull Request targeting main
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node 20 with npm cache for faster installs
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install all dependencies (including devDependencies for tsc)
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript type check — catches type errors without producing output
      - name: TypeScript type check
        run: npx tsc --noEmit

      # 5. Compile TypeScript → dist/
      - name: Build
        run: npm run build

      # 6. Verify the Docker image builds successfully
      - name: Docker build check
        run: docker build -t prism-backend:ci .
