name: CD — Deploy to Render

# Only runs when code is merged/pushed to main
on:
  push:
    branches: [main]

jobs:
  # ── Step 1: Run CI checks first ─────────────────────────────────────
  ci:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Docker build check
        run: docker build -t prism-backend:deploy .

  # ── Step 2: Deploy to Render (only if CI passed) ────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci           # waits for ci job to succeed before running

    steps:
      - name: Trigger Render Deploy
        run: |
          curl --fail -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Deployment triggered
        run: echo "Deploy triggered successfully. Check Render dashboard for live status."
